name: Daily S&P 500 Breadth Analysis

on:
  schedule:
    - cron: '0 4 * * *'  # 11 PM ET (4 AM UTC next day), every day including weekends
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          pip install yfinance pandas numpy plotly beautifulsoup4 requests lxml
      
      - name: Run breadth analysis
        run: |
          python MarketBreadth.py
      
      - name: Commit and push data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sp500_breadth_history.csv sp500_weights_history.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update breadth data - $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload HTML charts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: breadth-charts-${{ github.run_number }}
          path: |
            *.html
          retention-days: 30